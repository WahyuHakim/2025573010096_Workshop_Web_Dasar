<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="latihan-1.css">
</head>
<body>

<!-- ini pembungkus semua isi -->
<div class="container">

  <!-- bagian atas -->
  <header class="header">
    <h1>Admin Dashboard</h1>
  </header>

  <!-- menu samping -->
  <aside class="sidebar">
    <ul>
      <li>Dashboard</li>
      <li>Users</li>
      <li>Settings</li>
      <li>Logout</li>
    </ul>
  </aside>

  <!-- isi utama -->
  <main class="main">

    <!-- kotak info cepat -->
    <div class="cards">
      <div class="card">User: 120</div>
      <div class="card">Sales: 80</div>
      <div class="card">Orders: 45</div>
      <div class="card">Revenue: 2jt</div>
    </div>

    <!-- bagian bawah isi -->
    <div class="content-bawah">
      <div class="tabel">Tabel Data</div>
      <div class="grafik">Grafik</div>
    </div>

  </main>

</div>

</body>
</html>
