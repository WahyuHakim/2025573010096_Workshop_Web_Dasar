<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan 2</title>
  <link rel="stylesheet" href="latihan-2.css">
</head>
<body>

<h2>FAQ / Accordion</h2>

<!-- pakai details biar ga perlu javascript -->
<div class="faq">
  <details>
    <summary>Apa itu web?</summary>
    <p>Web adalah kumpulan halaman di internet.</p>
  </details>

  <details>
    <summary>Kenapa belajar CSS?</summary>
    <p>Biar tampilan website jadi keren.</p>
  </details>

  <details>
    <summary>Apakah sulit?</summary>
    <p>Kalau latihan terus pasti bisa.</p>
  </details>
</div>


<h2>Image Overlay</h2>

<!-- grid 4 gambar -->
<div class="galeri">
  <div class="item" style="background-image: url('https://picsum.photos/300?1');">
    <span>Gambar 1</span>
  </div>
  <div class="item" style="background-image: url('https://picsum.photos/300?2');">
    <span>Gambar 2</span>
  </div>
  <div class="item" style="background-image: url('https://picsum.photos/300?3');">
    <span>Gambar 3</span>
  </div>
  <div class="item" style="background-image: url('https://picsum.photos/300?4');">
    <span>Gambar 4</span>
  </div>
</div>


<h2>Progress Bar</h2>

<!-- pakai variable buat isi bar -->
<div class="progress" style="--progress: 75%;">
  <span>HTML - 75%</span>
</div>

<div class="progress" style="--progress: 50%;">
  <span>CSS - 50%</span>
</div>

<div class="progress" style="--progress: 90%;">
  <span>JavaScript - 90%</span>
</div>

</body>
</html>
