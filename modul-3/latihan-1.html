<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Komponen UI</title>
    <link rel="stylesheet" href="latihan-1.css">
</head>
<body>

    <main class="container">

        <h1>Komponen Button</h1>

        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-outline">Outline</button>

        <h1>Komponen Badge</h1>

        <span class="badge badge-primary">HTML</span>
        <span class="badge badge-success">CSS</span>
        <span class="badge badge-danger">JavaScript</span>

        <h1>Komponen Alert</h1>

        <div class="alert alert-success">
            ✅ Berhasil! Data telah disimpan.
        </div>

        <div class="alert alert-warning">
            ⚠️ Peringatan! Periksa kembali input Anda.
        </div>

        <div class="alert alert-error">
            ❌ Error! Terjadi kesalahan pada sistem.
        </div>

    </main>

</body>
</html>
